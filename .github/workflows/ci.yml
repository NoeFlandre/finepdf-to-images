name: CI

# The deterministic gauntlet, in the documented order:
#
#   baseline -> Ruff -> ty -> tests -> property tests -> acceptance tests
#            -> architecture checks -> CRAP -> mutation tests -> smoke test -> diff review
#
# Every required job runs offline: no FinePDFs download, no third-party site, no secret. The one
# step that is not a merge gate is mutation testing, and the reason is written down below.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

permissions:
  contents: read

jobs:
  quality:
    name: Deterministic quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true

      # 1. baseline
      - name: Baseline (locked install)
        run: uv sync --locked --all-groups

      # 2. Ruff
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

      # 3. ty
      - name: ty
        run: uv run ty check

      # 4-6. tests, property tests, acceptance tests
      - name: Tests
        run: uv run pytest -m "not architecture and not acceptance" --cov --cov-report=xml
      - name: Property tests
        run: uv run pytest -m property
      - name: Acceptance scenarios
        run: uv run pytest -m acceptance

      # 7. architecture checks
      - name: Architecture checks
        run: uv run pytest -m architecture

      # 8. CRAP
      - name: CRAP
        run: uv run python scripts/crap.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Smoke (real CLI + Docker)
    runs-on: ubuntu-latest
    # Gate 10 runs after gates 1-8, so the documented ordering is enforced rather than merely
    # described. Without this the jobs are concurrent and the "gauntlet" is a list, not a sequence.
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync
        run: uv sync --locked

      # 10. smoke test -- the real CLI, end to end, offline
      - name: CLI smoke
        run: bash scripts/smoke.sh "${{ runner.temp }}/smoke"

      - name: Build image
        run: docker build -t finepdf-to-images .
      - name: Docker smoke
        run: |
          docker run --rm finepdf-to-images --help > /dev/null
          docker run --rm finepdf-to-images version
          # The documented failure contract, checked in the image rather than assumed.
          if docker run --rm finepdf-to-images not-a-command > /dev/null 2>&1; then
            echo "an unknown command must not succeed"; exit 1
          fi

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Build MkDocs site strictly
        run: uv run --locked --group docs mkdocs build --strict

  mutation:
    name: Mutation tests (advisory)
    runs-on: ubuntu-latest
    needs: quality
    # Deliberately not a merge gate. Mutation testing takes minutes, and a kill rate is a
    # conversation rather than a pass/fail line: the honest response to a surviving mutant is
    # sometimes a new test and sometimes "that mutant is equivalent". Blocking on a percentage
    # would reward writing assertions that match the source rather than the behaviour.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync
        run: uv sync --locked --all-groups
      # No `|| true`: continue-on-error already keeps this off the merge path, and swallowing the
      # exit code as well would make a crashed mutmut indistinguishable from a clean advisory run.
      - name: Mutate the domain
        run: uv run mutmut run --max-children 4
      - name: Surviving mutants
        if: always()
        run: uv run mutmut results | tee mutants.txt
      - name: Upload surviving mutants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surviving-mutants
          path: mutants.txt
          if-no-files-found: ignore
