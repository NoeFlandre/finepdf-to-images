[project]
name = "finepdf-to-images"
version = "0.1.0"
description = "Tiny proof-of-concept pipeline for finding agriculture-relevant FinePDF documents and publishing their source PDFs and images."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Noe Flandre" }]
# pypdf and pillow are pinned exactly, not floored: their decoding determines the bytes of every
# published image, and therefore its sha256, its path, and the manifest digest. A minor bump would
# silently change the dataset.
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=0.28",
    "pillow==12.3.0",
    "pyarrow>=25.0.1",
    "pypdf==6.19.0",
]

[project.scripts]
finepdf-to-images = "finepdf_to_images.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finepdf_to_images"]

[dependency-groups]
docs = ["mkdocs>=1.6"]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.14",
    "ty>=0.0.1a10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF", "ARG", "PTH", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# The scoring tests feed the normalizer deliberately ambiguous characters -- em/en dashes,
# full-width Latin, NUL -- because folding them correctly is the behaviour under test. RUF001
# flagging them is the rule working as designed on a file where the "confusable" is the point.
"tests/unit/test_scoring.py" = ["ARG", "RUF001"]

[tool.ty.environment]
root = ["./src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["."]
markers = [
    "acceptance: end-to-end acceptance scenarios",
    "integration: tests crossing an I/O adapter boundary with local fixtures",
    "architecture: import-boundary and structural checks",
]

