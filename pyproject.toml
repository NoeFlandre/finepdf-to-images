[project]
name = "finepdf-to-images"
version = "0.1.0"
description = "Tiny proof-of-concept pipeline for finding agriculture-relevant FinePDF documents and publishing their source PDFs and images."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Noe Flandre" }]
# pypdf, pillow and pyarrow are pinned exactly, not floored: their decoding and encoding determine
# the bytes of every published file, and therefore its digest. A minor bump would silently change
# the dataset.
#
# pyarrow joined them when parquet became the published artifact. Every writer option is pinned in
# adapters/parquet.py, but the footer's `created_by` carries pyarrow's own version string and
# cannot be set through the API, so the output is byte-stable only for a given version. Upgrading
# it rewrites every published parquet and produces a commit that changes no data -- a deliberate
# republication, not a routine bump.
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=0.28",
    "pillow==12.3.0",
    "pyarrow==25.0.1",
    "pypdf==6.19.0",
]

[project.scripts]
finepdf-to-images = "finepdf_to_images.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finepdf_to_images"]

[dependency-groups]
docs = ["mkdocs>=1.6"]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3",
    "pytest>=8.3",
    "pytest-bdd>=8",
    "pytest-cov>=6",
    "pyyaml>=6.0",
    "radon>=6",
    "ruff>=0.14",
    "ty>=0.0.1a10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"
# Agent worktrees are checkouts of this same repository placed inside it by the harness. Linting
# them means linting another branch's in-progress code as if it were ours.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF", "ARG", "PTH", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# The scoring tests feed the normalizer deliberately ambiguous characters -- em/en dashes,
# full-width Latin, NUL -- because folding them correctly is the behaviour under test. RUF001
# flagging them is the rule working as designed on a file where the "confusable" is the point.
"tests/unit/test_scoring.py" = ["ARG", "RUF001"]

[tool.ty.environment]
root = ["./src", "."]

# Agent worktrees are checkouts of this repository placed inside it; type-checking them means
# type-checking another branch. Ruff excludes them for the same reason. File selection lives
# under `src`, not `environment` -- ty rejects an unknown key outright rather than ignoring it,
# so putting it in the wrong table failed the gate on every run.
[tool.ty.src]
exclude = [".claude"]

[tool.coverage.run]
branch = true
source = ["src/finepdf_to_images"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

# Mutation testing targets the pure domain only. That is where the decisions live -- what counts as
# relevant, what may be published, what a safe URL is -- and it is the code a surviving mutant says
# something real about. Mutating an adapter mostly produces mutants that only a network could kill.
[tool.mutmut]
source_paths = ["src"]
do_not_mutate = [
    "*/adapters/*",
    "*/cli.py",
    "*/pipeline.py",
    "*/__main__.py",
    "*/__init__.py",
]
# Unit *and* integration: several domain decisions are only exercised end to end, and a
# mutant that survives because the covering test was out of scope says nothing true.
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
also_copy = ["tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = [".", "src"]
markers = [
    "acceptance: end-to-end acceptance scenarios",
    "integration: tests crossing an I/O adapter boundary with local fixtures",
    "architecture: import-boundary and structural checks",
    "property: Hypothesis property-based tests",
]

